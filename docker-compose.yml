# TestPilot AI — Docker Compose
#
# The application only needs three things to run:
#   backend (FastAPI + Playwright) + SQLite (persistent volume) + the frontend.
# Unused services (PostgreSQL, Redis) have been removed — the app does not use them.
#
# The backend persists its SQLite database, generated artifacts and cloned
# repositories on named volumes so data survives `docker compose up -d --build`.

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: testpilot-backend:latest
    container_name: testpilot-backend
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      # Override storage paths so they point at the mounted volumes below,
      # regardless of what is set in .env.
      DATABASE_PATH: /data/testpilot.db
      ARTIFACTS_DIR: /artifacts
      REPOS_DIR: /repos
      BACKEND_PORT: "3001"
      BACKEND_URL: http://localhost:3001
      FRONTEND_URL: http://localhost:3000
    volumes:
      - testpilot_data:/data
      - testpilot_artifacts:/artifacts
      - testpilot_repos:/repos
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:3001/api/health', timeout=5).status == 200 else sys.exit(1)"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
    env_file:
      - .env
    restart: unless-stopped

volumes:
  testpilot_data:
  testpilot_artifacts:
  testpilot_repos:
